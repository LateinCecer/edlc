[package]
name = "edlc_doc_server"
version.workspace = true
edition = "2021"
license.workspace = true
description = "MCP and HTTP server for EDL documentation"
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["compiler", "edl", "documentation", "mcp"]
categories = ["compilers", "science"]

[[bin]]
name = "edlc_doc_server"
path = "src/main.rs"

[dependencies]
edlc_doc_db = { workspace = true }
rmcp = { version = "3", features = ["server", "transport-io", "schemars"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
schemars = "1"
thiserror = "2"

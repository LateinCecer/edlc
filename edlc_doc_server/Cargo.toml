[package]
name = "edlc_doc_server"
version.workspace = true
edition = "2021"
license.workspace = true
description = "MCP and HTTP server for EDL documentation"
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["compiler", "edl", "documentation", "mcp"]
categories = ["compilers", "science"]

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "edlc_doc_server"
path = "src/main.rs"

[dependencies]
edlc_doc_db = { workspace = true, optional = true }
rmcp = { version = "3", features = ["server", "transport-io", "schemars"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"], optional = true }
schemars = "1"
thiserror = "2"

# Leptos + axum (HTTP frontend)
leptos = { version = "0.8", features = ["nightly"] }
leptos_meta = { version = "0.8" }
leptos_router = { version = "0.8", features = ["nightly"] }
leptos_axum = { version = "0.8", optional = true }
axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"], optional = true }
wasm-bindgen = { version = "0.2", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }

# getrandom needs the wasm_js feature for WASM targets
getrandom = { version = "0.4", features = ["wasm_js"] }
# uuid needs a randomness source on WASM
uuid = { version = "1", features = ["js"] }

[features]
hydrate = ["leptos/hydrate", "dep:wasm-bindgen", "dep:console_error_panic_hook"]
ssr = [
    "dep:axum",
    "dep:leptos_axum",
    "dep:tokio",
    "dep:edlc_doc_db",
    "dep:rmcp",
    "dep:clap",
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
]
default = ["ssr"]

[package.metadata.leptos]
output-name = "edlc_doc_server"
site-root = "target/site"
site-pkg-dir = "pkg"
site-addr = "127.0.0.1:8080"
style-file = "style/main.css"
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false
lib-profile-release = "wasm-release"

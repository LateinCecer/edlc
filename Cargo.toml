
[workspace]
resolver = "3"
members = [
  "edlc_core",
  "edlc_codegen_cranelift",
  "edlc_docs",
  "edlc_layout",
  "edlc_lsp",
  "edlc_analysis",
  "edlc_doc_db",
  "edlc_doc_server",
  "examples/build_doc_db",
]

[workspace.package]
version = "0.2.22"
repository = "https://github.com/LateinCecer/edlc"
authors = ["Adrian Paskert"]
license = "AGPL-3"

[workspace.dependencies]
edlc_analysis = { path = "edlc_analysis" }
edlc_core = { path = "edlc_core" }
edlc_layout = { path = "edlc_layout" }
edlc_codegen_cranelift = { path = "edlc_codegen_cranelift" }
edlc_lsp = { path = "edlc_lsp" }
edlc_docs = { path = "edlc_docs" }
edlc_doc_db = { path = "edlc_doc_db" }

# Profile for the Leptos WASM client bundle (used by cargo-leptos).
[profile.wasm-release]
inherits = "release"
opt-level = 'z'
lto = true
codegen-units = 1
panic = "abort"

